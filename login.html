<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — JPRODUCTIONS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --deep:    #03030c;
            --c1:      #00f5ff;
            --c2:      #c77dff;
            --c3:      #ff6b9d;
            --c4:      #ffd97d;
            --surface: rgba(255,255,255,0.035);
            --border:  rgba(255,255,255,0.08);
            --text:    #e8e4f0;
            --muted:   #6b6580;
        }

        *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
        html, body { height:100%; font-family:'Inter',sans-serif; background:var(--deep); color:var(--text); overflow:hidden; }

        /* ===================== SPLIT ===================== */
        .split { display:flex; height:100vh; width:100vw; }

        /* ===================== LEFT PANEL ===================== */
        .left {
            flex: 0 0 56%;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3.5rem 4.5rem 3.5rem 5rem;
            overflow: hidden;
        }

        /* Animated crystal background */
        .left::before {
            content:'';
            position:absolute; inset:0;
            background:
                radial-gradient(ellipse 65% 55% at 15% 25%, rgba(0,245,255,0.16) 0%, transparent 55%),
                radial-gradient(ellipse 55% 65% at 85% 75%, rgba(199,125,255,0.20) 0%, transparent 55%),
                radial-gradient(ellipse 45% 45% at 50% 50%, rgba(255,107,157,0.08) 0%, transparent 55%);
            animation: crystalShift 10s ease-in-out infinite alternate;
            z-index:0;
        }
        .left::after {
            content:'';
            position:absolute; inset:0;
            background:
                radial-gradient(ellipse 38% 38% at 75% 18%, rgba(255,217,125,0.11) 0%, transparent 55%),
                radial-gradient(ellipse 32% 42% at 25% 82%, rgba(0,245,255,0.09) 0%, transparent 55%);
            animation: crystalShift 10s ease-in-out infinite alternate-reverse;
            z-index:0;
        }
        @keyframes crystalShift {
            0%   { filter:blur(42px) hue-rotate(0deg);   opacity:1; }
            50%  { filter:blur(58px) hue-rotate(18deg);  opacity:.88; }
            100% { filter:blur(48px) hue-rotate(-12deg); opacity:1; }
        }

        /* Fine grid */
        .left-grid {
            position:absolute; inset:0;
            background-image:
                linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
            background-size: 52px 52px;
            z-index:1;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 75%);
        }

        .left-content { position:relative; z-index:2; }

        /* Brand label */
        .brand-label {
            font-size:.68rem;
            letter-spacing:.28em;
            color:var(--c1);
            margin-bottom:1.25rem;
            font-weight:500;
            opacity:.75;
            text-transform:uppercase;
        }

        /* ===== ANIMATED JPRODUCTIONS ===== */
        .brand-name {
            font-family:'Cinzel',serif;
            font-size:clamp(2.9rem, 5.2vw, 4.6rem);
            font-weight:900;
            line-height:1.02;
            margin-bottom:2.25rem;
            background: linear-gradient(125deg, #fff 0%, var(--c1) 28%, var(--c2) 55%, var(--c3) 78%, var(--c4) 100%);
            background-size: 280% 280%;
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
            background-clip:text;
            animation: brandShimmer 6s ease-in-out infinite alternate,
                       brandFloat 5.5s ease-in-out infinite;
            position: relative;
            display: inline-block;
            filter: drop-shadow(0 0 18px rgba(0,245,255,0.25));
        }
        @keyframes brandShimmer {
            0%   { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }
        @keyframes brandFloat {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-7px); }
        }

        /* Typewriter */
        .typewriter-wrap {
            display:flex;
            align-items:center;
            gap:.7rem;
            margin-bottom:2.75rem;
        }
        .tw-dot {
            width:7px; height:7px; border-radius:50%;
            background:var(--c2);
            box-shadow:0 0 10px var(--c2), 0 0 20px rgba(199,125,255,0.4);
            flex-shrink:0;
            animation: pulseDot 2s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { transform:scale(1); opacity:1; }
            50%      { transform:scale(1.25); opacity:.7; }
        }
        .typewriter {
            font-size:1.05rem;
            font-weight:400;
            color:rgba(232,228,240,0.72);
            letter-spacing:.03em;
            min-height:1.5em;
        }
        .cursor {
            display:inline-block;
            width:2px; height:1.05em;
            background:var(--c1);
            margin-left:3px;
            vertical-align:middle;
            animation:blink .65s step-end infinite;
            box-shadow:0 0 8px var(--c1);
        }
        @keyframes blink { 50% { opacity:0; } }

        /* Badges */
        .badges { display:flex; gap:.65rem; flex-wrap:wrap; }
        .badge {
            padding:.32rem .85rem;
            border-radius:2rem;
            font-size:.7rem;
            font-weight:500;
            letter-spacing:.05em;
            border:1px solid;
            backdrop-filter:blur(10px);
            transition: transform .2s, box-shadow .2s;
        }
        .badge:hover { transform:translateY(-2px); }
        .badge-1 { color:var(--c1); border-color:rgba(0,245,255,0.28);   background:rgba(0,245,255,0.07);   box-shadow:0 0 14px rgba(0,245,255,0.12); }
        .badge-2 { color:var(--c2); border-color:rgba(199,125,255,0.28); background:rgba(199,125,255,0.07); box-shadow:0 0 14px rgba(199,125,255,0.12); }
        .badge-3 { color:var(--c3); border-color:rgba(255,107,157,0.28); background:rgba(255,107,157,0.07); box-shadow:0 0 14px rgba(255,107,157,0.12); }
        .badge-4 { color:var(--c4); border-color:rgba(255,217,125,0.28); background:rgba(255,217,125,0.07); box-shadow:0 0 14px rgba(255,217,125,0.12); }

        /* ===================== MOVING MIC ===================== */
        .mic-container {
            position: absolute;
            bottom: 6%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            animation: micFloat 4.8s ease-in-out infinite;
        }
        @keyframes micFloat {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50%      { transform: translateX(-50%) translateY(-12px); }
        }

        .mic-svg {
            width: 52px;
            height: 52px;
            filter: drop-shadow(0 0 12px rgba(0,245,255,0.45));
        }
        .mic-body { fill: url(#micGrad); }
        .mic-stand { stroke: rgba(255,255,255,0.35); stroke-width: 2.5; fill: none; }

        /* Sound waves */
        .wave {
            position: absolute;
            border: 1.5px solid;
            border-radius: 50%;
            opacity: 0;
            animation: waveExpand 2.8s ease-out infinite;
        }
        .wave-1 { width: 70px; height: 70px; border-color: rgba(0,245,255,0.5); animation-delay: 0s; }
        .wave-2 { width: 70px; height: 70px; border-color: rgba(199,125,255,0.45); animation-delay: 0.7s; }
        .wave-3 { width: 70px; height: 70px; border-color: rgba(255,107,157,0.4); animation-delay: 1.4s; }

        @keyframes waveExpand {
            0%   { transform: scale(0.6); opacity: 0.7; }
            100% { transform: scale(2.1); opacity: 0; }
        }

        /* ===================== DIVIDER ===================== */
        .divider-v {
            flex:0 0 1px;
            background:linear-gradient(180deg, transparent, rgba(255,255,255,0.07) 25%, rgba(255,255,255,0.07) 75%, transparent);
        }

        /* ===================== RIGHT PANEL ===================== */
        .right {
            flex:1;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:2.5rem;
            position:relative;
            overflow:hidden;
        }
        .right::before {
            content:'';
            position:absolute; inset:0;
            background:radial-gradient(ellipse 85% 85% at 50% 50%, rgba(199,125,255,0.055) 0%, transparent 70%);
            pointer-events:none;
        }

        /* Iridescent card */
        .card-wrap {
            position:relative;
            width:100%;
            max-width:400px;
        }
        .card-wrap::before {
            content:'';
            position:absolute;
            inset:-1.8px;
            border-radius:1.5rem;
            background:linear-gradient(135deg, var(--c1), var(--c2), var(--c3), var(--c4), var(--c1));
            background-size:320% 320%;
            animation:borderShift 6s linear infinite;
            z-index:0;
            opacity:.55;
        }
        @keyframes borderShift {
            0%   { background-position:0% 50%; }
            50%  { background-position:100% 50%; }
            100% { background-position:0% 50%; }
        }

        .card {
            position:relative;
            z-index:1;
            background:rgba(4,4,16,0.90);
            backdrop-filter:blur(28px);
            -webkit-backdrop-filter:blur(28px);
            border-radius:1.4rem;
            padding:2.6rem 2.4rem;
            border:1px solid rgba(255,255,255,0.05);
        }

        .card-eyebrow {
            font-size:.63rem;
            letter-spacing:.2em;
            color:var(--c2);
            margin-bottom:.45rem;
            font-weight:500;
        }
        .card-title {
            font-family:'Cinzel',serif;
            font-size:1.55rem;
            font-weight:600;
            color:#fff;
            margin-bottom:.25rem;
        }
        .card-sub {
            font-size:.82rem;
            color:var(--muted);
            margin-bottom:2.1rem;
        }

        /* Form */
        .field {
            display:flex;
            flex-direction:column;
            gap:.38rem;
            margin-bottom:1.15rem;
        }
        .field label {
            font-size:.68rem;
            letter-spacing:.12em;
            color:rgba(255,255,255,0.38);
            font-weight:500;
        }
        .field input {
            background:rgba(255,255,255,0.035);
            border:1px solid var(--border);
            border-radius:.65rem;
            color:var(--text);
            font-family:'Inter',sans-serif;
            font-size:.93rem;
            padding:.82rem 1.05rem;
            transition:border-color .22s, box-shadow .22s, background .22s;
            width:100%;
        }
        .field input::placeholder { color:rgba(255,255,255,0.14); }
        .field input:focus {
            outline:none;
            border-color:rgba(0,245,255,0.45);
            background:rgba(0,245,255,0.03);
            box-shadow:0 0 0 3px rgba(0,245,255,0.06), 0 0 22px rgba(0,245,255,0.08);
        }

        .btn-login {
            width:100%;
            padding:.88rem;
            border:none;
            border-radius:.7rem;
            font-family:'Inter',sans-serif;
            font-size:.93rem;
            font-weight:600;
            cursor:pointer;
            letter-spacing:.04em;
            margin-top:.4rem;
            background:linear-gradient(135deg, var(--c1), var(--c2));
            background-size:200% 200%;
            color:#03030c;
            transition:box-shadow .25s, transform .15s;
            animation:btnShimmer 4.5s ease infinite;
        }
        @keyframes btnShimmer {
            0%   { background-position:0% 50%; }
            50%  { background-position:100% 50%; }
            100% { background-position:0% 50%; }
        }
        .btn-login:hover {
            box-shadow:0 0 30px rgba(0,245,255,0.38), 0 0 60px rgba(199,125,255,0.22);
            transform:translateY(-2px);
        }
        .btn-login:active { transform:scale(.985); }
        .btn-login:disabled { opacity:.48; cursor:not-allowed; transform:none; }

        #status {
            text-align:center;
            font-size:.8rem;
            margin-top:.8rem;
            min-height:1.15rem;
        }
        .success { color:#4ade80; }
        .error   { color:#f87171; }

        .card-footer {
            margin-top:1.85rem;
            padding-top:1.55rem;
            border-top:1px solid var(--border);
            text-align:center;
        }
        .card-footer p {
            font-size:.8rem;
            color:var(--muted);
            margin-bottom:.65rem;
        }
        .btn-register {
            display:inline-block;
            padding:.58rem 1.55rem;
            border:1px solid rgba(199,125,255,0.32);
            border-radius:2rem;
            color:var(--c2);
            font-size:.82rem;
            font-weight:500;
            text-decoration:none;
            transition:background .22s, box-shadow .22s, transform .15s;
            letter-spacing:.03em;
        }
        .btn-register:hover {
            background:rgba(199,125,255,0.09);
            box-shadow:0 0 18px rgba(199,125,255,0.22);
            transform:translateY(-1px);
        }
        .guest-link {
            display:block;
            margin-top:.95rem;
            font-size:.74rem;
            color:rgba(255,255,255,0.18);
            text-decoration:none;
            transition:color .2s;
        }
        .guest-link:hover { color:rgba(255,255,255,0.42); }

        /* ===================== MOBILE ===================== */
        @media (max-width:820px) {
            html, body { overflow:auto; }
            .split { flex-direction:column; height:auto; min-height:100vh; }
            .left {
                flex:none;
                padding:3.2rem 2rem 2.5rem;
                min-height:auto;
            }
            .mic-container { display:none; }
            .divider-v { display:none; }
            .right { padding:1.8rem 1.5rem 3rem; }
            .brand-name { font-size:2.6rem; }
            .card { padding:2.2rem 1.8rem; }
        }
    </style>
</head>
<body>
<div class="split">

    <!-- LEFT -->
    <div class="left">
        <div class="left-grid"></div>
        <div class="left-content">
            <p class="brand-label">Performer Booking System</p>
            <h1 class="brand-name">JPRODUCTIONS</h1>

            <div class="typewriter-wrap">
                <span class="tw-dot"></span>
                <span class="typewriter" id="tw"></span><span class="cursor"></span>
            </div>

            <div class="badges">
                <span class="badge badge-1">Champion Vocalist</span>
                <span class="badge badge-2">Grand Champion</span>
                <span class="badge badge-3">Live Performer</span>
                <span class="badge badge-4">BSCS Student</span>
            </div>
        </div>

        <!-- Moving Mic -->
        <div class="mic-container">
            <div class="wave wave-1"></div>
            <div class="wave wave-2"></div>
            <div class="wave wave-3"></div>
            <svg class="mic-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00f5ff"/>
                        <stop offset="50%" stop-color="#c77dff"/>
                        <stop offset="100%" stop-color="#ff6b9d"/>
                    </linearGradient>
                </defs>
                <!-- Mic head -->
                <rect x="22" y="8" width="20" height="28" rx="10" class="mic-body"/>
                <!-- Mic stand -->
                <path d="M32 36v10" class="mic-stand"/>
                <path d="M22 46h20" class="mic-stand"/>
                <path d="M18 50h28" class="mic-stand"/>
            </svg>
        </div>
    </div>

    <div class="divider-v"></div>

    <!-- RIGHT -->
    <div class="right">
        <div class="card-wrap">
            <div class="card">
                <p class="card-eyebrow">WELCOME BACK</p>
                <h2 class="card-title">Sign In</h2>
                <p class="card-sub">Access the booking system</p>

                <form id="login-form">
                    <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" placeholder="juan@gmail.com" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-login" id="login-btn">Sign In</button>
                    <p id="status"></p>
                </form>

                <div class="card-footer">
                    <p>Don't have an account?</p>
                    <a href="Register.html" class="btn-register">Create Account</a>
                    <a href="HTML.html" class="guest-link">Continue as guest →</a>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    // TYPEWRITER
    const words = ["Champion Vocalist","Grand Champion","Live Performer","Online Performer","BSCS Student"];
    let wi = 0, ci = 0, deleting = false;
    const tw = document.getElementById("tw");
    function type() {
        const word = words[wi];
        if (!deleting) {
            tw.textContent = word.slice(0, ++ci);
            if (ci === word.length) { deleting = true; setTimeout(type, 1800); return; }
        } else {
            tw.textContent = word.slice(0, --ci);
            if (ci === 0) { deleting = false; wi = (wi + 1) % words.length; }
        }
        setTimeout(type, deleting ? 50 : 80);
    }
    type();

    // FIREBASE LOGIN
    if (!firebase.apps.length) {
        firebase.initializeApp({
            apiKey: "AIzaSyDYRfZGOhmdyjNRFlNAsL15iEhPXlbCwxU",
            authDomain: "justins-booking.firebaseapp.com",
            projectId: "justins-booking",
            storageBucket: "justins-booking.firebasestorage.app",
            messagingSenderId: "1025617742708",
            appId: "1:1025617742708:web:09d4fcc825a6f3513d7a21"
        });
    }
    const db = firebase.firestore();

    document.getElementById("login-form").addEventListener("submit", async e => {
        e.preventDefault();
        const s   = document.getElementById("status");
        const btn = document.getElementById("login-btn");
        const email = document.getElementById("email").value.trim();
        const pass  = document.getElementById("password").value;

        btn.disabled = true;
        btn.textContent = "Signing in...";
        s.textContent = "";
        s.className = "";

        try {
            const result = await db.collection("users")
                .where("email", "==", email)
                .where("password", "==", pass)
                .get();

            if (!result.empty) {
                sessionStorage.setItem("loggedIn", "true");
                sessionStorage.setItem("userName", result.docs[0].data().fullname);
                s.textContent = "Welcome back! Redirecting...";
                s.className = "success";
                setTimeout(() => window.location.href = "HTML.html", 1400);
            } else {
                s.textContent = "Invalid email or password.";
                s.className = "error";
                btn.disabled = false;
                btn.textContent = "Sign In";
            }
        } catch (err) {
            s.textContent = "Something went wrong. Try again.";
            s.className = "error";
            btn.disabled = false;
            btn.textContent = "Sign In";
        }
    });
</script>
</body>
</html>
