<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Administration — JPRODUCTIONS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <!-- Strict Security Gatekeeper -->
    <script>
        const emailSession = sessionStorage.getItem("userEmail");
        const emailLocal = localStorage.getItem("userEmail");
        const currentEmail = emailSession || emailLocal;
        const isLoggedIn = sessionStorage.getItem("loggedIn") || localStorage.getItem("loggedIn");

        if (!isLoggedIn || !currentEmail || currentEmail.toLowerCase().trim() !== "justinpheymiranda@gmail.com") {
            alert("Access Denied: Eksklusibo lamang ang pahinang ito para kay justinpheymiranda@gmail.com");
            window.location.href = "index.html";
        }
    </script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="admin-shell" style="max-width: 1100px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem;">
    <div class="admin-top" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem;">
        <h1 style="font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700;">Auditions Management</h1>
        <div class="admin-actions" style="display: flex; gap: 0.6rem;">
            <button type="button" id="btn-refresh" class="btn btn-ghost">Refresh Records</button>
            <a href="index.html" class="btn btn-ghost">← Return to Main Site</a>
            <button type="button" id="btn-theme" class="btn btn-ghost">Toggle Theme</button>
        </div>
    </div>

    <!-- Administrative Statistics -->
    <div class="admin-stats" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.85rem; margin-bottom: 1.5rem;">
        <div class="stat-card" style="background: var(--panel-bg); border: 1.5px solid var(--border); border-radius: 0.85rem; padding: 1rem; text-align: center;">
            <div class="num" id="count-all" style="font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; color: var(--c1);">0</div>
            <div class="lbl" style="font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase;">Total Submissions</div>
        </div>
        <div class="stat-card" style="background: var(--panel-bg); border: 1.5px solid var(--border); border-radius: 0.85rem; padding: 1rem; text-align: center;">
            <div class="num" id="count-pending" style="font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; color: var(--c1);">0</div>
            <div class="lbl" style="font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase;">Pending Evaluation</div>
        </div>
        <div class="stat-card" style="background: var(--panel-bg); border: 1.5px solid var(--border); border-radius: 0.85rem; padding: 1rem; text-align: center;">
            <div class="num" id="count-shortlisted" style="font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; color: var(--c1);">0</div>
            <div class="lbl" style="font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase;">Shortlisted</div>
        </div>
        <div class="stat-card" style="background: var(--panel-bg); border: 1.5px solid var(--border); border-radius: 0.85rem; padding: 1rem; text-align: center;">
            <div class="num" id="count-accepted" style="font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 700; color: var(--c1);">0</div>
            <div class="lbl" style="font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase;">Accepted</div>
        </div>
    </div>

    <!-- Filtering Controls -->
    <div class="filter-row" style="display: flex; gap: 0.5rem; margin-bottom: 1.25rem;">
        <button type="button" class="filter-btn active" data-filter="all">All Entries</button>
        <button type="button" class="filter-btn" data-filter="pending">Pending</button>
        <button type="button" class="filter-btn" data-filter="shortlisted">Shortlisted</button>
        <button type="button" class="filter-btn" data-filter="accepted">Accepted</button>
        <button type="button" class="filter-btn" data-filter="passed">Passed</button>
    </div>

    <!-- Record List Container -->
    <div id="aud-list" class="aud-list" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="loading-state">Loading audition records…</div>
    </div>
</div>

<script src="firebase-config.js"></script>
<script>
(function () {
    const root = document.documentElement;
    root.setAttribute("data-theme", localStorage.getItem("theme") || "dark");

    document.getElementById("btn-theme").addEventListener("click", () => {
        const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
    });

    const db = firebase.firestore();
    let allDocs = [];
    let currentFilter = "all";

    function formatDate(ts) {
        if (!ts) return "—";
        try {
            const d = ts.toDate ? ts.toDate() : new Date(ts);
            return d.toLocaleString();
        } catch { return "—"; }
    }

    function statusClass(s) {
        return "status-" + (s || "pending");
    }

    function escapeHtml(str) {
        return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    function render() {
        const list = document.getElementById("aud-list");
        const filtered = currentFilter === "all"
            ? allDocs
            : allDocs.filter(d => (d.data.status || "pending") === currentFilter);

        document.getElementById("count-all").textContent = allDocs.length;
        document.getElementById("count-pending").textContent = allDocs.filter(d => (d.data.status || "pending") === "pending").length;
        document.getElementById("count-shortlisted").textContent = allDocs.filter(d => d.data.status === "shortlisted").length;
        document.getElementById("count-accepted").textContent = allDocs.filter(d => d.data.status === "accepted").length;

        if (!filtered.length) {
            list.innerHTML = '<div class="empty-state" style="text-align:center; padding:2rem; color:var(--text-muted);">No audition entries match the selected filter.</div>';
            return;
        }

        list.innerHTML = filtered.map(({ id, data }) => {
            const st = data.status || "pending";
            return `
            <article class="aud-card" data-id="${id}" style="background: var(--panel-bg); border: 1.5px solid var(--border); border-radius: 1rem; padding: 1.35rem; position: relative;">
                <div class="aud-card-head" style="display: flex; justify-content: space-between; margin-bottom: 0.85rem;">
                    <div>
                        <div class="aud-name" style="font-family: 'Cinzel', serif; font-size: 1.1rem; font-weight: 600;">${escapeHtml(data.fullName || "Unspecified")}</div>
                        <div class="aud-meta" style="font-size: 0.8rem; color: var(--text-muted);">${escapeHtml(data.city || "")} &bull; Submitted: ${formatDate(data.submittedAt)}</div>
                    </div>
                    <span class="status-badge ${statusClass(st)}" style="font-size: 0.72rem; padding: 0.3rem 0.7rem; border-radius: 2rem; border: 1px solid var(--border);">${escapeHtml(st)}</span>
                </div>
                <div class="aud-actions" style="display: flex; gap: 0.5rem; padding-top: 0.75rem; border-top: 1px solid var(--border);">
                    <button type="button" data-status="pending" ${st === "pending" ? "disabled" : ""} class="btn btn-ghost" style="font-size:0.78rem; padding:0.3rem 0.6rem;">Pending</button>
                    <button type="button" data-status="shortlisted" ${st === "shortlisted" ? "disabled" : ""} class="btn btn-ghost" style="font-size:0.78rem; padding:0.3rem 0.6rem;">Shortlist</button>
                    <button type="button" data-status="accepted" ${st === "accepted" ? "disabled" : ""} class="btn btn-ghost" style="font-size:0.78rem; padding:0.3rem 0.6rem;">Accept</button>
                    <button type="button" data-status="passed" ${st === "passed" ? "disabled" : ""} class="btn btn-ghost" style="font-size:0.78rem; padding:0.3rem 0.6rem;">Pass</button>
                </div>
            </article>`;
        }).join("");

        list.querySelectorAll(".aud-actions button").forEach(btn => {
            btn.addEventListener("click", async () => {
                const card = btn.closest(".aud-card");
                const id = card.dataset.id;
                const status = btn.dataset.status;
                btn.disabled = true;
                try {
                    await db.collection("auditions").doc(id).update({
                        status,
                        reviewedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    const doc = allDocs.find(d => d.id === id);
                    if (doc) doc.data.status = status;
                    render();
                } catch (err) {
                    console.error("Error updating status:", err);
                    alert("Failed to update status.");
                    btn.disabled = false;
                }
            });
        });
    }

    async function loadAuditions() {
        const list = document.getElementById("aud-list");
        list.innerHTML = '<div class="loading-state" style="text-align:center; padding:2rem;">Retrieving records…</div>';
        try {
            const snap = await db.collection("auditions").orderBy("submittedAt", "desc").get();
            allDocs = snap.docs.map(d => ({ id: d.id, data: d.data() }));
            render();
        } catch (err) {
            try {
                const snap = await db.collection("auditions").get();
                allDocs = snap.docs.map(d => ({ id: d.id, data: d.data() }));
                render();
            } catch (err2) {
                list.innerHTML = '<div class="error-state" style="text-align:center; padding:2rem; color:#f87171;">Unable to load database entries.</div>';
            }
        }
    }

    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentFilter = btn.dataset.filter;
            render();
        });
    });

    document.getElementById("btn-refresh").addEventListener("click", loadAuditions);

    loadAuditions();
})();
</script>
</body>
</html>
